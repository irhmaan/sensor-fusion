controller_manager:
  ros__parameters:
    update_rate: 50 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["fl_wheel_joint", "rl_wheel_joint"]
    right_wheel_names: ["fr_wheel_joint", "rr_wheel_joint"]

    wheel_separation: 0.334 # track_width
    wheel_radius: 0.065

    publish_rate: 50.0
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"

    linear.x.max_velocity: 1.0
    linear.x.mean_velocity: -1.0
    angular.z.max_velocity: 1.0
    angular.z.mean_velocity: -1.0

    # Publish odometry on /odom
    # publish_odom_to_tf: true
    use_stamped_vel: true
    enable_odom_tf: true
    open_loop: true
